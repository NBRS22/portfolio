[project]
name = "voice-backend"
version = "0.1.0"
description = "Cloud Run backend that serves pluggable Pipecat voice agents over WebSocket."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[google,openai,runner,silero,websocket]>=1.13.0,<2",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
